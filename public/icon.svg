<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#12241A" />
      <stop offset="100%" stop-color="#050806" />
    </radialGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#00E676" stroke-width="3" stroke-opacity="0.25" />

  <!-- Billiard Ring Circle -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#00E676" stroke-width="2" stroke-opacity="0.18" />
  <circle cx="256" cy="256" r="148" fill="#0D1611" stroke="#00E676" stroke-width="2.5" stroke-opacity="0.4" filter="url(#emeraldGlow)" />

  <!-- Monogram "LU" -->
  <g fill="url(#emeraldGrad)">
    <!-- L -->
    <path d="M 176 180 L 204 180 L 204 304 L 260 304 L 260 332 L 176 332 Z" />
    <!-- U -->
    <path d="M 276 180 L 304 180 L 304 286 C 304 316 320 332 344 332 C 368 332 384 316 384 286 L 384 180 L 412 180 L 412 288 C 412 334 386 356 344 356 C 302 356 276 334 276 288 Z" transform="translate(-32, 0)" />
  </g>

  <!-- Subtle Cue Ball Dot -->
  <circle cx="340" cy="192" r="10" fill="#FFFFFF" opacity="0.9" />
  <circle cx="340" cy="192" r="16" fill="none" stroke="#00E676" stroke-width="2" opacity="0.6" />
</svg>
